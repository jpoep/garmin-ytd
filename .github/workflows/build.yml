name: Build

# Every PR and push to main: test, lint and build a signed release APK (uploaded as an artifact).
# Tags vMAJOR.MINOR.PATCH additionally publish that exact APK as a GitHub Release.
on:
  push:
    branches: [main]
    tags: ['v*.*.*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Secrets are not available to PRs from forks; those builds fall back to the debug key.
      HAS_SIGNING_KEY: ${{ secrets.RIDEYTD_KEYSTORE_BASE64 != '' }}
      IS_RELEASE: ${{ startsWith(github.ref, 'refs/tags/v') }}
    outputs:
      apk: ${{ steps.apk.outputs.name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '27'

      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - name: Signing key
        if: env.HAS_SIGNING_KEY == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.RIDEYTD_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.RIDEYTD_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.RIDEYTD_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.RIDEYTD_KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
          mkdir -p ~/.gradle
          {
            echo "rideYtd.storeFile=$RUNNER_TEMP/release.jks"
            echo "rideYtd.storePassword=$STORE_PASSWORD"
            echo "rideYtd.keyAlias=$KEY_ALIAS"
            echo "rideYtd.keyPassword=$KEY_PASSWORD"
          } >> ~/.gradle/gradle.properties

      - name: Refuse to release without the signing key
        if: env.IS_RELEASE == 'true' && env.HAS_SIGNING_KEY != 'true'
        run: |
          echo "::error::Release tags must be signed with the release key, but the signing secrets are missing."
          exit 1

      - name: Test, lint and build
        run: |
          version_arg=()
          if [[ "$IS_RELEASE" == true ]]; then version_arg=(-PrideYtd.version="${GITHUB_REF_NAME#v}"); fi
          ./gradlew :app:testDebugUnitTest :app:lintRelease :app:assembleRelease "${version_arg[@]}"

      - name: Name and verify APK
        id: apk
        run: |
          if [[ "$IS_RELEASE" == true ]]; then label="${GITHUB_REF_NAME#v}"; else label="${GITHUB_SHA::7}"; fi
          name="RideYTD-$label.apk"
          cp app/build/outputs/apk/release/app-release.apk "$name"
          apksigner="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)/apksigner"
          "$apksigner" verify --print-certs "$name" | tee signing.txt
          if [[ "$HAS_SIGNING_KEY" == true ]] && ! grep -q 'CN=Ride YTD' signing.txt; then
            echo "::error::APK is not signed with the release key"; exit 1
          fi
          echo "name=$name" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: apk
          path: ${{ steps.apk.outputs.name }}
          if-no-files-found: error
          retention-days: 30

      - name: Upload test and lint reports
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: reports
          path: |
            app/build/reports/
            app/build/test-results/
          retention-days: 14

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: apk

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          APK: ${{ needs.build.outputs.apk }}
        run: |
          gh release create "$GITHUB_REF_NAME" "$APK" \
            --repo "$GITHUB_REPOSITORY" \
            --title "Ride YTD ${GITHUB_REF_NAME#v}" \
            --generate-notes \
            --verify-tag
